name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish, but
# never queue more than one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # base_path is "/<repo>" for a project site and "" for a user site or a
      # custom domain; PAGES_BASE wants a trailing slash either way.
      - name: Build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npx vite build

      - name: Prerender static site
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: node scripts/prerender-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
